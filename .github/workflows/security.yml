name: Segurança do repositório

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Ações fixadas nos commits das versões verificadas.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Instalar Gitleaks com checksum da versão fixada
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          download_dir="${RUNNER_TEMP}/gitleaks-download"
          mkdir -p "$install_dir" "$download_dir"
          cd "$download_dir"
          curl --fail --silent --show-error --location "${release}/${archive}" --output "$archive"
          curl --fail --silent --show-error --location "${release}/gitleaks_${version}_checksums.txt" --output checksums.txt
          awk -v archive="$archive" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' checksums.txt > selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Verificar caminhos e segredos
        run: python scripts/check_repository_security.py
      - name: Validar regressões do verificador
        env:
          GITLEAKS_BIN: gitleaks
        run: python -m unittest discover -s scripts/tests -v
